<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Website project template</title>
</head>
<script>
    const loadComponents = (id, url, textColor = '') =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            const container = document.getElementById(id);
            if (!container) {
                return;
            }

            container.innerHTML = html;
            container.style.color = textColor;
        });
    }

    const isHomePage = () => {
        const page = window.location.pathname.split('/').pop()?.toLowerCase();
        return page === '' || page === 'index.html' || page === 'home.html';
    }

    window.onload = () => {
        loadComponents('header', './src/sections/header.html');
        loadComponents('hero', './src/sections/hero.html');
        loadComponents('main', './src/sections/mainhomepage.html');
        loadComponents('contact', './src/sections/contact.html');
        loadComponents('footer', './src/sections/footer.html', isHomePage() ? '' : '#1d5d3f');
    }
</script>
<body>
    <div id="main"></div>
    <div id="footer"></div>
</body>
</html>
