<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Privacy Policy - Baumeister</title>
</head>
<script>
    const setHeaderTheme = () => {
        const nav = document.getElementById('navbar-container');
        if (!nav) return;

        const pageName = window.location.pathname.split('/').pop().toLowerCase();
        const isSecondaryPage = pageName.includes('imprint') || pageName.includes('privacy');
        const color = isSecondaryPage ? '#016A46' : '#000000';

        nav.classList.remove('text-black', 'text-[#016A46]');
        nav.style.color = color;
        document.body.style.color = color;
    };

    const loadComponents = (id, url) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;

                if (id === 'header') {
                    setHeaderTheme();
                }
            });
    };

    window.onload = () => {
        loadComponents('header', 'src/sections/header.html');
        loadComponents('privacy-content', 'src/sections/privacy-content.html');
        loadComponents('footer', 'src/sections/footer.html');
    };
</script>
<body class="bg-white text-[#016A46]">
    <div id="header"></div>
    <div id="privacy-content"></div>
    <div id="footer"></div>
</body>
</html>
